name: 시트 데이터 갱신

on:
  schedule:
    - cron: "17 * * * *"   # 매시간 17분
  workflow_dispatch:        # Actions 탭에서 'Run workflow'로 즉시 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 시트에서 CSV 내려받기
        run: python scripts/fetch_data.py
      - name: 바뀐 내용 커밋
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898289+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "시트 데이터 자동 갱신"
            git push
          else
            echo "변경 없음"
          fi
